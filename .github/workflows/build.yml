name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev rustc cargo
        pip3 install --user --upgrade buildozer cython virtualenv

    - name: Prepare python-for-android
      run: |
        git clone https://github.com/kivy/python-for-android.git
        python3 patch_p4a.py

    - name: Build with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PondeusePro-APK
        path: bin/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0-build-${{ github.run_number }}
        name: Pondeuse Pro APK v1.0 (Build ${{ github.run_number }})
        body: |
          Application Android Pondeuse Pro (.apk).
          Téléchargez le fichier APK ci-dessous pour l'installer directement sur votre smartphone ou tablette Android.
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
